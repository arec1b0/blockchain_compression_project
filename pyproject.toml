[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[project]
name = "blockchain-compression-project"
version = "0.2.0"
description = "Blockchain data compression and storage management toolkit"
readme = "docs/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniil Krizhanovskyi", email = "daniil.krizhanovsyki@hotmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/arec1b0/blockchain_compression_project"

[project.scripts]
blockchain-compress = "blockchain_compression.main:main"
blockchain-compress-bench = "blockchain_compression.benchmarks.compression_benchmark:main"

[dependency-groups]
test = [
    "pytest>=7",
    "pytest-cov>=5",
]
lint = [
    "ruff>=0.4",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "blockchain_compression"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
